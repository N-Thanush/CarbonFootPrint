# ========================
# Application Name
# ========================
spring.application.name=carbonfootprint

# ========================
# PostgreSQL Configuration
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/carbonfootprint
spring.datasource.username=postgres
spring.datasource.password=coc2006
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Server
# ========================
server.port=8080

# ========================
# JWT Configuration
# ========================
app.jwt.secret=4f8a2b3c9d1e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a
app.jwt.expiration-ms=86400000

# ========================
# Google OAuth2 Configuration
# ========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ========================
# Google reCAPTCHA v2 Configuration
# ========================
app.recaptcha.enabled=true
app.recaptcha.site-key=6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
app.recaptcha.secret-key=6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe

# ========================
# Logging
# ========================
logging.level.com.infosys.carbonfootprint=DEBUG
logging.level.org.springframework.security=DEBUG

